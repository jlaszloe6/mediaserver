name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Bash syntax check (scripts, caddy, cron, dnsmasq)
        run: |
          shopt -s nullglob
          status=0
          for f in scripts/*.sh scripts/lib/*.sh tests/*.sh tests/support/*.sh caddy/*.sh cron/*.sh dnsmasq/*.sh; do
            echo "bash -n $f"
            bash -n "$f" || status=1
          done
          exit "$status"

      - name: Shell helper regression tests
        run: ./tests/test-shell-helpers.sh

      - name: Compile status-page
        run: python3 -m compileall -q status-page

      - name: Status-page regression tests
        run: |
          pip install -q -r status-page/requirements.txt
          python3 tests/test-status-page.py

      - name: Validate docker-compose.yml
        run: |
          cp .env.example .env
          docker compose config --quiet
          rm -f .env
