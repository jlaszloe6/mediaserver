name: Deploy to freya-pc

on:
  push:
    branches: [master]
    paths-ignore:
      - '*.md'
      - '.gitignore'
      - '.env.example'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Bash syntax check (scripts, caddy, cron, dnsmasq, ebook-pipeline)
        run: |
          shopt -s nullglob
          status=0
          for f in scripts/*.sh scripts/lib/*.sh tests/*.sh tests/support/*.sh caddy/*.sh cron/*.sh dnsmasq/*.sh ebook-pipeline/*.sh; do
            echo "bash -n $f"
            bash -n "$f" || status=1
          done
          exit "$status"

      - name: Shell helper regression tests
        run: ./tests/test-shell-helpers.sh

      - name: Compile status-page
        run: python3 -m compileall -q status-page

      - name: Status-page regression tests
        run: |
          pip install -q -r status-page/requirements.txt
          python3 tests/test-status-page.py

      - name: Validate docker-compose.yml
        run: |
          cp .env.example .env
          docker compose config --quiet
          rm -f .env

  deploy:
    needs: validate
    runs-on: [self-hosted, freya-pc]
    steps:
      - name: Pull latest changes
        working-directory: /opt/mediaserver
        run: git pull origin master

      - name: Detect changed services
        id: changes
        working-directory: /opt/mediaserver
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          rebuild_statuspage=false
          rebuild_cron=false
          rebuild_caddy=false
          rebuild_dnsmasq=false
          rebuild_ebook_pipeline=false

          changed=$(git diff --name-only "$BEFORE" "$AFTER" 2>/dev/null || echo "")

          if echo "$changed" | grep -q '^status-page/'; then
            rebuild_statuspage=true
          fi
          if echo "$changed" | grep -qE '^(cron/|scripts/)'; then
            rebuild_cron=true
          fi
          if echo "$changed" | grep -q '^caddy/'; then
            rebuild_caddy=true
          fi
          if echo "$changed" | grep -q '^dnsmasq/'; then
            rebuild_dnsmasq=true
          fi
          if echo "$changed" | grep -q '^ebook-pipeline/'; then
            rebuild_ebook_pipeline=true
          fi

          compose_changed=false
          if echo "$changed" | grep -q '^docker-compose.yml$'; then
            compose_changed=true
          fi

          echo "rebuild_statuspage=$rebuild_statuspage" >> "$GITHUB_OUTPUT"
          echo "rebuild_cron=$rebuild_cron" >> "$GITHUB_OUTPUT"
          echo "rebuild_caddy=$rebuild_caddy" >> "$GITHUB_OUTPUT"
          echo "rebuild_dnsmasq=$rebuild_dnsmasq" >> "$GITHUB_OUTPUT"
          echo "rebuild_ebook_pipeline=$rebuild_ebook_pipeline" >> "$GITHUB_OUTPUT"
          echo "compose_changed=$compose_changed" >> "$GITHUB_OUTPUT"
          echo "any_rebuild=$([ "$rebuild_statuspage" = true ] || [ "$rebuild_cron" = true ] || [ "$rebuild_caddy" = true ] || [ "$rebuild_dnsmasq" = true ] || [ "$rebuild_ebook_pipeline" = true ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

          echo "Changed files:"
          echo "$changed"
          echo "Rebuild: statuspage=$rebuild_statuspage cron=$rebuild_cron caddy=$rebuild_caddy dnsmasq=$rebuild_dnsmasq ebook_pipeline=$rebuild_ebook_pipeline compose=$compose_changed"

      - name: Build and restart statuspage
        if: steps.changes.outputs.rebuild_statuspage == 'true'
        working-directory: /opt/mediaserver
        run: docker compose up -d --build --no-deps statuspage

      - name: Build and restart cron
        if: steps.changes.outputs.rebuild_cron == 'true'
        working-directory: /opt/mediaserver
        run: docker compose up -d --build --no-deps cron

      - name: Build and restart caddy
        if: steps.changes.outputs.rebuild_caddy == 'true'
        working-directory: /opt/mediaserver
        run: docker compose up -d --build --force-recreate --no-deps caddy

      - name: Build and restart dnsmasq
        if: steps.changes.outputs.rebuild_dnsmasq == 'true'
        working-directory: /opt/mediaserver
        run: docker compose up -d --build --no-deps dnsmasq

      - name: Build and restart ebook-pipeline
        if: steps.changes.outputs.rebuild_ebook_pipeline == 'true'
        working-directory: /opt/mediaserver
        run: docker compose up -d --build --no-deps ebook-pipeline

      # Selective rebuilds above only touch the custom-built services that
      # changed. This step always runs afterward and reconciles the FULL
      # compose model against docker-compose.yml, so drift between what's
      # actually running and what the compose file describes can't survive
      # a deploy — this is what PR #88 was missing: it only ran
      # `--no-recreate`, which is a no-op for a container whose config
      # (e.g. the newly added `devices:` for GPU passthrough) changed but
      # was already running, so Jellyfin kept running without GPU access
      # despite a "successful" deploy.
      # https://github.com/jlaszloe6/mediaserver/actions/runs/30205305541
      - name: Reconcile full Compose model
        working-directory: /opt/mediaserver
        run: |
          if [ "${{ steps.changes.outputs.compose_changed }}" = "true" ]; then
            docker compose up -d --build
          else
            docker compose up -d --no-build
          fi

      # Only meaningful once the compose model has actually been
      # reconciled above — checking before that would just confirm the
      # pre-deploy state, which is exactly how #88 went unnoticed.
      - name: Verify every service is running and healthy
        working-directory: /opt/mediaserver
        run: |
          sleep 10
          failed=false
          for svc in $(docker compose config --services); do
            cid=$(docker compose ps -q "$svc")
            if [ -z "$cid" ]; then
              echo "::error::$svc has no container"
              failed=true
              continue
            fi

            status=$(docker inspect --format='{{.State.Status}}' "$cid")
            echo "$svc: status=$status"
            if [ "$status" != "running" ]; then
              echo "::error::$svc is not running (status=$status)"
              failed=true
              continue
            fi

            health=$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{end}}' "$cid")
            if [ -n "$health" ]; then
              echo "$svc: health=$health"
              # "starting" is allowed — some health checks use 30s
              # intervals and haven't reported a real result yet.
              if [ "$health" = "unhealthy" ]; then
                echo "::error::$svc is unhealthy"
                failed=true
              fi
            fi
          done

          if [ "$failed" = true ]; then
            exit 1
          fi
          echo "All services running and healthy (or still starting)."
