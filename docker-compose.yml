networks:
  mediaserver:
    name: mediaserver

services:

  jellyfin:
    # jellyfin v10.11.11
    image: lscr.io/linuxserver/jellyfin@sha256:b8dcc7b71d0ea872b74314da4b995c0cf282b1778438c295996e7be88c70fdda
    container_name: jellyfin
    networks:
      - mediaserver
    ports:
      - "${SERVER_IP:-127.0.0.1}:8096:8096"
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=Europe/Budapest
    volumes:
      - ./config/jellyfin:/config
      - ${MEDIA_ROOT}/media/tv:/tv
      - ${MEDIA_ROOT}/media/movies:/movies
      - ${MEDIA_ROOT}/media/tv-guests:/tv-guests
      - ${MEDIA_ROOT}/media/movies-guests:/movies-guests
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "992" # host's render group gid, grants access to /dev/dri/renderD128
    mem_limit: 4g
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8096/health"]
      interval: 30s
      timeout: 5s
      retries: 3


  transmission:
    # transmission v4.1.3
    image: lscr.io/linuxserver/transmission@sha256:81787bc706d3833d252e6d8b94545fea46bf2156f616320991a395619a477d2c
    container_name: transmission
    networks:
      - mediaserver
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=Europe/Budapest
      - PEERPORT=51413
      - TRANSMISSION_SPEED_LIMIT_DOWN_ENABLED=${TRANSMISSION_DOWNLOAD_LIMIT_ENABLED:-false}
      - TRANSMISSION_SPEED_LIMIT_DOWN=${TRANSMISSION_DOWNLOAD_LIMIT:-0}
      - TRANSMISSION_SPEED_LIMIT_UP_ENABLED=${TRANSMISSION_UPLOAD_LIMIT_ENABLED:-true}
      - TRANSMISSION_SPEED_LIMIT_UP=${TRANSMISSION_UPLOAD_LIMIT:-50}
    volumes:
      - ./config/transmission:/config
      - ./scripts/transmission-speed-limits.sh:/custom-cont-init.d/speed-limits.sh:ro
      - ${MEDIA_ROOT}/torrents:/downloads
      - ${MEDIA_ROOT}/watch:/watch
    ports:
      - "51413:51413"
      - "51413:51413/udp"
    mem_limit: 2g
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9091/transmission/rpc || [ $? -eq 22 ]"]
      interval: 30s
      timeout: 5s
      retries: 3


  sonarr:
    # sonarr v4.0.19.2979
    image: lscr.io/linuxserver/sonarr@sha256:373159ba768e23a3a1c497d9f2b936addf8fd5b1fdce7dd6a14080ac928bfda0
    container_name: sonarr
    networks:
      - mediaserver
    depends_on:
      - transmission
      - prowlarr
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=Europe/Budapest
    volumes:
      - ./config/sonarr:/config
      - ${MEDIA_ROOT}:/data
    mem_limit: 1g
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8989/ping"]
      interval: 30s
      timeout: 5s
      retries: 3


  radarr:
    # radarr v6.3.0.10514
    image: lscr.io/linuxserver/radarr@sha256:a45b5ab0f850f39edb4cc9c95bbd967b52ddc3d4574a4dfb45561177db6c88f4
    container_name: radarr
    networks:
      - mediaserver
    depends_on:
      - transmission
      - prowlarr
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=Europe/Budapest
    volumes:
      - ./config/radarr:/config
      - ${MEDIA_ROOT}:/data
    mem_limit: 1g
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7878/ping"]
      interval: 30s
      timeout: 5s
      retries: 3


  bazarr:
    # bazarr v1.6.0 — subtitle automation for Sonarr/Radarr
    image: lscr.io/linuxserver/bazarr@sha256:e464484e7e6cff8ee189036c9ba96977ab054104ea18067ecf6171d0f3f3f8f2
    container_name: bazarr
    networks:
      - mediaserver
    depends_on:
      - sonarr
      - radarr
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=Europe/Budapest
    volumes:
      - ./config/bazarr:/config
      # Must match Sonarr/Radarr (${MEDIA_ROOT}:/data) so episode paths map 1:1
      - ${MEDIA_ROOT}:/data
    mem_limit: 512m
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:6767/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3


  lidarr:
    # lidarr v3.1.0.4875-ls38 — music acquisition/management (Sonarr/Radarr equivalent for music)
    image: lscr.io/linuxserver/lidarr@sha256:bfec0ec2dc351fa5928379d785b08be395886f109393b9040ed7973bd1008060
    container_name: lidarr
    networks:
      - mediaserver
    ports:
      - "${SERVER_IP:-127.0.0.1}:8686:8686"
    depends_on:
      - transmission
      - prowlarr
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=Europe/Budapest
    volumes:
      - ./config/lidarr:/config
      # Same whole-root mount as Sonarr/Radarr so /downloads and /media/music map 1:1
      - ${MEDIA_ROOT}:/data
    mem_limit: 1g
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8686/ping"]
      interval: 30s
      timeout: 5s
      retries: 3


  prowlarr:
    # prowlarr v2.5.2.5491
    image: lscr.io/linuxserver/prowlarr@sha256:1295cff29d10b486c0d8324d1559a552140a5932bf8b3d87e398654414f63f92
    container_name: prowlarr
    networks:
      - mediaserver
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=Europe/Budapest
    volumes:
      - ./config/prowlarr:/config
    mem_limit: 512m
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9696/ping"]
      interval: 30s
      timeout: 5s
      retries: 3


  seerr:
    # seerr v3.4.1 — v3.4.0 patches GHSA-mc6w-69r3-62h8 (path traversal -> RCE in avatar image proxy)
    image: ghcr.io/seerr-team/seerr@sha256:f4768de5f616248d723e05891f3345a1402123775d03bf0890dbfedc0831bda1
    container_name: seerr
    networks:
      - mediaserver
    ports:
      - "${SERVER_IP:-127.0.0.1}:5055:5055"
    environment:
      - TZ=Europe/Budapest
    volumes:
      - ./config/overseerr:/app/config
    mem_limit: 512m
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:5055/api/v1/status || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3


  navidrome:
    # navidrome v0.63.2 — lightweight Subsonic/OpenSubsonic-compatible music server
    image: deluan/navidrome@sha256:9012939114fbb1bb641b81cf96dec5ded15f0aafefe8d47a511d7cb919658e40
    container_name: navidrome
    networks:
      - mediaserver
    ports:
      - "${SERVER_IP:-127.0.0.1}:4533:4533"
    # Official image has no PUID/PGID (linuxserver-style) support; it runs as
    # whatever `user:` is set to, so align it directly with the mediaserver
    # system user instead (same reasoning as Seerr's fixed UID 1000 case).
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      - TZ=Europe/Budapest
    volumes:
      - ./config/navidrome:/data
      - ${MEDIA_ROOT}/media/music:/music:ro
    mem_limit: 1g
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # Official image is a bare Go binary + busybox — no curl, only wget
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:4533/ping"]
      interval: 30s
      timeout: 5s
      retries: 3


  audiobookshelf:
    # audiobookshelf v2.36.0 — audiobook server
    image: ghcr.io/advplyr/audiobookshelf@sha256:180acad33d69c99ed208676465d8edcb268fa46967735579a7810859885b1a8e
    container_name: audiobookshelf
    networks:
      - mediaserver
    ports:
      - "${SERVER_IP:-127.0.0.1}:13378:13378"
    # Official image has no PUID/PGID (linuxserver-style) support; it runs as
    # whatever `user:` is set to, so align it directly with the mediaserver
    # system user instead (same reasoning as Seerr's fixed UID 1000 case).
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      - TZ=Europe/Budapest
      - PORT=13378
    volumes:
      - ./config/audiobookshelf/config:/config
      - ./config/audiobookshelf/metadata:/metadata
      - ${MEDIA_ROOT}/media/audiobooks:/audiobooks
      - ${MEDIA_ROOT}/media/ebooks:/ebooks
      - ${MEDIA_ROOT}/media/podcasts:/podcasts
    mem_limit: 1g
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:13378/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3


  caddy:
    build:
      context: ./caddy
      network: host
    container_name: caddy
    networks:
      - mediaserver
    ports:
      - "443:443"
    environment:
      - DUCKDNS_TOKEN=${DUCKDNS_TOKEN}
      - CADDY_DOMAIN_JELLYFIN=${CADDY_DOMAIN_JELLYFIN}
      - CADDY_DOMAIN_SEERR=${CADDY_DOMAIN_SEERR}
      - CADDY_DOMAIN_STATUS=${CADDY_DOMAIN_STATUS}
      - CADDY_DOMAIN_NAVIDROME=${CADDY_DOMAIN_NAVIDROME}
      - CADDY_DOMAIN_AUDIOBOOKSHELF=${CADDY_DOMAIN_AUDIOBOOKSHELF}
      - MAXMIND_ACCOUNT_ID=${MAXMIND_ACCOUNT_ID}
      - MAXMIND_LICENSE_KEY=${MAXMIND_LICENSE_KEY}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./config/caddy/data:/data
      - ./config/caddy/config:/config
    mem_limit: 512m
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3


  duckdns:
    # duckdns latest (rebuilt 2026-08-03, was pinned from 2026-03-09)
    image: lscr.io/linuxserver/duckdns@sha256:ac65c0d1d2cdfd380ab7b450d97b8c80b2a30f2e086bd79b4cce2fc7190d33a6
    container_name: duckdns
    networks:
      - mediaserver
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=Europe/Budapest
      - SUBDOMAINS=${DUCKDNS_SUBDOMAINS}
      - TOKEN=${DUCKDNS_TOKEN}
      - UPDATE_IP=ipv4
      - LOG_FILE=true
    volumes:
      - ./config/duckdns:/config
    mem_limit: 128m
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true


  statuspage:
    build:
      context: ./status-page
    container_name: statuspage
    networks:
      - mediaserver
    # Official python:3.12-slim image has no PUID/PGID support; runs as
    # whatever `user:` is set to, so align it with the mediaserver system
    # user (same reasoning as Navidrome/Audiobookshelf's fixed user: usage).
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      - SECRET_KEY=${STATUSPAGE_SECRET_KEY}
      - ALLOWED_EMAILS=${STATUSPAGE_ALLOWED_EMAILS}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
      - BASE_URL=${STATUSPAGE_BASE_URL}
      - SONARR_API_KEY=${SONARR_API_KEY}
      - RADARR_API_KEY=${RADARR_API_KEY}
      - JELLYFIN_API_KEY=${JELLYFIN_API_KEY}
      - JELLYFIN_EXTERNAL_URL=${JELLYFIN_EXTERNAL_URL}
      - PROWLARR_API_KEY=${PROWLARR_API_KEY}
      - SEERR_API_KEY=${SEERR_API_KEY}
      - SMTP_SERVER=${SMTP_SERVER}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM=${SMTP_FROM}
      - TURNSTILE_SITE_KEY=${TURNSTILE_SITE_KEY}
      - TURNSTILE_SECRET_KEY=${TURNSTILE_SECRET_KEY}
      - REQUIRE_TURNSTILE=${REQUIRE_TURNSTILE:-true}
      - SERVER_NAME=${SERVER_NAME:-Media Server}
    volumes:
      - ./config/statuspage:/app/data
    mem_limit: 256m
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/login"]
      interval: 30s
      timeout: 5s
      retries: 3

  cron:
    build:
      context: .
      dockerfile: cron/Dockerfile
      args:
        PUID: ${PUID:-1000}
        PGID: ${PGID:-1000}
    container_name: cron
    networks:
      - mediaserver
    environment:
      - TZ=Europe/Budapest
      - STATUSPAGE_DB_PATH=/config/statuspage/statuspage.db
      - SERVER_NAME=${SERVER_NAME:-Media Server}
    volumes:
      - ./scripts:/scripts:ro
      - ./.env:/config/.env:ro
      - ./config/statuspage:/config/statuspage:ro
      - ./config:/config/all-configs:ro
      - ./.ssh:/config/ssh-keys:ro
      - ${MEDIA_ROOT}:/mnt/mediaserver
      - cron-state:/var/tmp
      - cron-logs:/var/log/cron
    mem_limit: 256m
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  ebook-pipeline:
    # Automated ebook download pipeline: drop a .torrent into $MEDIA_ROOT/watch-ebooks,
    # this container adds it to Transmission via RPC, waits for completion,
    # converts to epub with Calibre, and imports it into Audiobookshelf.
    # Separate from the `cron` service because Calibre needs glibc — a bad
    # fit for the Alpine cron image.
    build:
      context: .
      dockerfile: ebook-pipeline/Dockerfile
      args:
        PUID: ${PUID:-1000}
        PGID: ${PGID:-1000}
    container_name: ebook-pipeline
    networks:
      - mediaserver
    depends_on:
      - transmission
      - audiobookshelf
    # Only the specific secrets this script actually uses are passed in -
    # not the whole .env - and only the three specific media-root
    # subdirectories it touches are mounted, not the whole NAS root. This
    # container parses untrusted downloaded file content through Calibre,
    # so it shouldn't have blast-radius access to Sonarr/Radarr/Jellyfin/
    # Seerr/DuckDNS/backup-encryption keys or the rest of the media library
    # and backups if that ever went wrong.
    environment:
      - TZ=Europe/Budapest
      - SERVER_NAME=${SERVER_NAME:-Media Server}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
      - AUDIOBOOKSHELF_API_KEY=${AUDIOBOOKSHELF_API_KEY:-}
      - SMTP_SERVER=${SMTP_SERVER:-}
      - SMTP_PORT=${SMTP_PORT:-}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-}
    volumes:
      - ./scripts:/scripts:ro
      - ${MEDIA_ROOT}/watch-ebooks:/mnt/mediaserver/watch-ebooks
      - ${MEDIA_ROOT}/torrents/complete/ebooks-incoming:/mnt/mediaserver/torrents/complete/ebooks-incoming
      - ${MEDIA_ROOT}/media/ebooks:/mnt/mediaserver/media/ebooks
      - ebook-pipeline-logs:/var/log/cron
    mem_limit: 1g
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

volumes:
  cron-state:
  cron-logs:
  ebook-pipeline-logs:
